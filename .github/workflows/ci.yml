# CI for pull requests and pushes to main (and staging, which Render deploys after green checks);
# feature branches are covered by their pull request, so pushes there do not run CI twice.
# The release workflow calls it as well (workflow_call).
# Order: fast static checks with the secret scan first, then tests, then the Docker image with
# vulnerability scan, SBOM, smoke test, browser test and a short load test.
# Third-party actions are pinned to full commit SHAs (version in the comment); Dependabot updates them.
# Details: docs/enterprise/qualitaet-und-lieferkette.md
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # Fast checks without a database: secret scan, dependencies, lint, format (changed files),
  # types, texts. The secret scan runs first so it is not skipped when a later step fails.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Secret scan over the whole history with the gitleaks binary (checksum verified).
      - name: Install gitleaks
        run: |
          # Outside the checkout, so later steps (lint, format, security check) never see the binary.
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Secret scan (gitleaks)
        id: gitleaks
        run: >-
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" .
      - if: failure() && steps.gitleaks.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.sarif
          retention-days: 7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Dependency scan (high and critical findings block the build)
        run: npm audit --audit-level=high
      - name: Registry signatures of the installed packages (R3-09)
        run: npm audit signatures
      - name: Static security check (R3-09)
        run: npm run check:security
      - name: Lint (ESLint)
        run: npm run lint
      - run: npm run typecheck
      - name: Text catalogue (R2-50)
        run: npm run check:texts
      # Only files changed against the base are checked: new files must be formatted, changed
      # files get a warning (the code base predates Prettier; see the docs).
      - name: Format check (changed files)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          BASE="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1)"
          fi
          node tools/format-changed.mjs "$BASE"

  # Server tests with coverage (plain postgres:16, trigram fallback), frontend tests and build.
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ideenportal
          POSTGRES_PASSWORD: ideenportal
          POSTGRES_DB: ideenportal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ideenportal"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Server tests with coverage thresholds
        run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgres://ideenportal:ideenportal@localhost:5432/ideenportal_test
      - name: Frontend tests
        run: npm test --workspace web
      - run: npm run build
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-server
          path: server/coverage
          retention-days: 14
          if-no-files-found: ignore

  # Server tests against PostgreSQL with pgvector (R3-28): semantic duplicate check with HNSW index.
  test-pgvector:
    name: Tests (pgvector)
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ideenportal
          POSTGRES_PASSWORD: ideenportal
          POSTGRES_DB: ideenportal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ideenportal"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test --workspace server
        env:
          TEST_DATABASE_URL: postgres://ideenportal:ideenportal@localhost:5432/ideenportal_test
          EXPECT_PGVECTOR: 'true'

  # Docker image: build with the commit, vulnerability scan (Trivy), SBOM (CycloneDX).
  image:
    name: Image, scan and SBOM
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --build-arg "GIT_COMMIT=${GITHUB_SHA}" -t ideenportal:ci .
      - name: Vulnerability scan (HIGH and CRITICAL with a fix block the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ideenportal:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: SBOM (CycloneDX) of the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ideenportal:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30
      - name: Save image for the smoke test
        run: docker save ideenportal:ci | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  # The built image against PostgreSQL: health check, version, browser smoke test with
  # accessibility check (WCAG 2.1 AA) and a short load test (R3-28) in the same container image.
  e2e:
    name: Image smoke, browser and load test
    runs-on: ubuntu-latest
    needs: [image, test]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ideenportal
          POSTGRES_PASSWORD: ideenportal
          POSTGRES_DB: ideenportal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ideenportal"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - run: gunzip -c image.tar.gz | docker load
      - name: Start the image
        run: |
          # The image runs with NODE_ENV=production, which requires a SECRET_KEY of 32+ characters.
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://ideenportal:ideenportal@localhost:5432/ideenportal \
            -e SECRET_KEY="ci-only-$(openssl rand -hex 24)" \
            -e DEMO_MODE=true -e MAIL_TRANSPORT=none -e PORT=3000 \
            ideenportal:ci
          for _ in $(seq 1 60); do curl -sf http://localhost:3000/api/health/ready > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/api/health/ready || { docker logs app; exit 1; }
          curl -sf http://localhost:3000/api/health/live
      - name: Version and commit of the image
        run: |
          curl -sf http://localhost:3000/api/version | tee version.json
          node -e "const v=require('./version.json'); const p=require('./package.json'); if (v.commit !== process.env.GITHUB_SHA || v.version !== p.version) { console.error('unexpected version', v); process.exit(1); }"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # The browser test has its own package (Playwright, axe); the app runs from the image,
      # so the root dependencies are not installed in this job.
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: node smoke.mjs screenshots
        working-directory: e2e
      - name: Short load test (5 000 ideas, separate database)
        run: |
          PGPASSWORD=ideenportal psql -h localhost -U ideenportal -d ideenportal -c 'CREATE DATABASE ideenportal_load'
          docker run --rm --network host \
            -e DATABASE_URL=postgres://ideenportal:ideenportal@localhost:5432/ideenportal_load \
            -e SECRET_KEY="ci-only-$(openssl rand -hex 24)" \
            -e IDEAS=5000 -e RUNS=20 -e RATE_LIMIT_FACTOR=0 -e MAIL_TRANSPORT=none \
            ideenportal:ci node server/dist/db/loadtest.js | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: docker logs app > server.log 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: |
            e2e/screenshots
            server.log
          retention-days: 14
