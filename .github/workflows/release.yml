# Release on a version tag (v1.2.3): the full CI first, then the image for linux/amd64 to
# ghcr.io/<owner>/<repo> with the tags <version> and latest, keyless cosign signature, CycloneDX
# SBOM (attached to the release and attested to the image) and a GitHub release whose notes come
# from the CHANGELOG.md section of the version. Details: docs/enterprise/qualitaet-und-lieferkette.md
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Image, signature, SBOM and release
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 30
    permissions:
      contents: write # GitHub release
      packages: write # ghcr.io
      id-token: write # keyless signing (Sigstore OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from the tag matches package.json and CHANGELOG.md
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for f in package.json server/package.json web/package.json; do
            PKG="$(node -p "require('./$f').version")"
            if [ "$PKG" != "$VERSION" ]; then echo "::error file=$f::version $PKG does not match tag $GITHUB_REF_NAME"; exit 1; fi
          done
          node tools/changelog-section.mjs "$VERSION" > release-notes.md
          IMAGE="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$VERSION"
            echo "image=$IMAGE"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: SBOM (CycloneDX) of the pushed image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign the image and attest the SBOM (keyless)
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo
            echo "## Image"
            echo
            echo "\`${IMAGE}:${VERSION}\` (\`${DIGEST}\`), signiert mit cosign (keyless). Prüfen:"
            echo
            echo "\`\`\`"
            echo "cosign verify ${IMAGE}@${DIGEST} --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "\`\`\`"
          } >> release-notes.md
          cp sbom.cdx.json "ideenportal-${VERSION}-sbom.cdx.json"
          gh release create "$GITHUB_REF_NAME" --title "Ideenportal ${VERSION}" --notes-file release-notes.md --verify-tag "ideenportal-${VERSION}-sbom.cdx.json"
