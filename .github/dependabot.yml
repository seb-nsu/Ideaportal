# Dependency updates (docs/enterprise/qualitaet-und-lieferkette.md): npm weekly, GitHub Actions
# and Docker monthly (fewer CI runs; security updates still come right away), minor and patch
# updates grouped into one pull request per ecosystem and directory; major updates come one by one.
version: 2
updates:
  # The root lock file covers the workspaces server/ and web/ (npm workspaces).
  - package-ecosystem: npm
    directories:
      - /
      - /server
      - /web
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: deps
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # 0.9 changes the DOMParser options, and node-saml/xml-crypto still bring 0.8 (SAML would mix
    # two DOM versions). Lift this once they move to 0.9.
    ignore:
      - dependency-name: '@xmldom/xmldom'
        versions: ['>=0.9.0']

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Berlin
    labels: [dependencies]
    commit-message:
      prefix: deps(e2e)
    groups:
      e2e-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '05:00'
      timezone: Europe/Berlin
    labels: [dependencies]
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: '05:00'
      timezone: Europe/Berlin
    labels: [dependencies]
    commit-message:
      prefix: docker
    # A new Node.js major version is a deliberate step (engines, CI); only minor/patch here.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
